<style>
body {
  margin: 0px;
  padding: 0px;
  overflow: hidden;
  font-family: arial;
  background: black;
}

.FPS{
  color: #505050;
  position: absolute;
  z-index: 10;
  top: 5px;
  left: 5px;
}
</style>

<body translate="no">
  <div id="fps" class="FPS"></div>
<canvas id="content"></canvas>
  
    <script id="rendered-js" >
var text = "Magic!";
var gatherStep = 1;

var fps = document.getElementById("fps");
var fpsCount = 0;

var canvas = document.getElementById("content");
var ctx = canvas.getContext("2d");
ctx.fillStyle = "#ffffff";
var colorWhite = 255 << 24 | 255 << 16 | 255 << 8 | 255;
var imageData = null;
var pixels8 = null;
var pixels32 = null;

var height = 0;
var width = 0;
var particles = [];
var scale = 0;
var frame = 0;

setInterval(fpsDisplay, 1000);

function fpsDisplay() {
  fps.innerText = "FPS: " + fpsCount;
  fpsCount = 0;
}

function init() {
  particles.length = 0;
  height = window.innerHeight;
  width = window.innerWidth;

  canvas.height = height;
  canvas.width = width;

  var fontSize = Math.min(height, width) / 2.5;
  ctx.font = fontSize + 'px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(text, width / 2, height / 2 + fontSize / 4);

  imageData = ctx.getImageData(0, 0, width, height);
  pixels8 = imageData.data;
  pixels32 = new Uint32Array(pixels8.buffer);

  for (var x = 0; x < width; x += gatherStep) {
    for (var y = 0; y < height; y += gatherStep) {
      var color = pixels32[y * width + x];
      if (color != 0) {
        var color = 255 << 24 | ~~(Math.random() * 50) << 16 | ~~(Math.random() * 200) + 54 << 8 | ~~(Math.random() * 50);
        particles.push({ x: x, y: y, color: color });
      }
    }
  }
}

function animation() {
  frame += .01;
  scale = (Math.cos(frame * 1) + 1) * Math.max(width, height) / 1.8;
  fpsCount += 1;
  pixels32.fill(0);
  for (var i = 0; i < particles.length; i++) {
    var particle = particles[i];
    var dX = scale * Math.cos(i + frame); // Store in array instead
    var dY = scale * Math.sin(i + frame);
    var xPart = ~~(particle.x + dX);
    if (xPart >= 0 && xPart < width) {
      var yPart = ~~(particle.y + dY);
      if (yPart >= 0 && yPart < height) {
        var ptr = yPart * width + xPart;
        var color = particle.color;
        //if( (~~(frame*300 + ptr*i) % 10) == 5) color = colorWhite;
        if (Math.random() < 0.05) color = colorWhite; // Use better PRNG here...
        pixels32[ptr] = color;
        pixels32[ptr + 1] = color;
        pixels32[ptr + width] = color;
        pixels32[ptr + width + 1] = color;
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
  requestAnimationFrame(animation);
}


init();
window.onresize = init;

animation();
//# sourceURL=pen.js
  </script>

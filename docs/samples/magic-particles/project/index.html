<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Magic text</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; background: black; font-family: arial; overflow: hidden; }
      #root { position: relative; overflow: hidden; background: black; }
      .clip { position: absolute; }
      #content { left: 0; top: 0; width: 1920px; height: 1080px; }
      #credit {
        right: 96px; bottom: 54px; margin: 0;
        font-family: Arial, "Liberation Sans", sans-serif; font-size: 24px;
        color: #5a5a5a; z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <canvas id="content" class="clip" width="1920" height="1080" data-start="0" data-duration="10"></canvas>
      <p id="credit" class="clip" data-start="0" data-duration="10">Magic text — SarahC (CodePen, MIT)</p>
    </div>
    <script>
      // ---- Seeded PRNG (mulberry32) replacing Math.random ----
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          var t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // Stateless hash -> [0,1) for the per-frame white sparkle, so any frame can be drawn alone.
      function hash01(a, b) {
        var h = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x632BE5AB, 0xC2B2AE35);
        h ^= h >>> 16; h = Math.imul(h, 0x7FEB352D);
        h ^= h >>> 15; h = Math.imul(h, 0x846CA68B);
        h ^= h >>> 16;
        return (h >>> 0) / 4294967296;
      }

      var text = "Magic!";
      var gatherStep = 1;
      var width = 1920, height = 1080;
      var STEP_RATE = 60;      // the original advances one step per display refresh (~60 per second)
      var FRAME_STEP = 0.01;   // ...and adds .01 to `frame` each step

      var canvas = document.getElementById("content");
      var ctx = canvas.getContext("2d");
      var colorWhite = 255 << 24 | 255 << 16 | 255 << 8 | 255;
      var imageData, pixels8, pixels32;
      var px, py, pcol, count = 0;

      function init() {
        var rand = mulberry32(20171019);
        ctx.fillStyle = "#ffffff";
        var fontSize = Math.min(height, width) / 2.5;
        ctx.font = fontSize + 'px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(text, width / 2, height / 2 + fontSize / 4);

        imageData = ctx.getImageData(0, 0, width, height);
        pixels8 = imageData.data;
        pixels32 = new Uint32Array(pixels8.buffer);

        var xs = [], ys = [], cs = [];
        for (var x = 0; x < width; x += gatherStep) {
          for (var y = 0; y < height; y += gatherStep) {
            if (pixels32[y * width + x] != 0) {
              var color = 255 << 24 | ~~(rand() * 50) << 16 | ~~(rand() * 200) + 54 << 8 | ~~(rand() * 50);
              xs.push(x); ys.push(y); cs.push(color);
            }
          }
        }
        count = xs.length;
        px = Int32Array.from(xs); py = Int32Array.from(ys); pcol = Uint32Array.from(cs);
      }

      // Particle state is a closed-form function of the step counter (the original's motion has no
      // other state), so drawing time t equals simulating the original from 0 up to t in fixed steps.
      function draw(t) {
        var stepF = t * STEP_RATE;
        var step = Math.floor(stepF + 1e-6);     // integer step, for the sparkle
        var frame = FRAME_STEP * (stepF + 1);    // continuous phase, smooth at any render fps
        var scale = (Math.cos(frame * 1) + 1) * Math.max(width, height) / 1.8;
        pixels32.fill(0);
        for (var i = 0; i < count; i++) {
          var a = i + frame;
          var xPart = ~~(px[i] + scale * Math.cos(a));
          if (xPart >= 0 && xPart < width) {
            var yPart = ~~(py[i] + scale * Math.sin(a));
            if (yPart >= 0 && yPart < height) {
              var ptr = yPart * width + xPart;
              var color = pcol[i];
              if (hash01(step, i) < 0.05) color = colorWhite;
              pixels32[ptr] = color;
              pixels32[ptr + 1] = color;
              pixels32[ptr + width] = color;
              pixels32[ptr + width + 1] = color;
            }
          }
        }
        ctx.putImageData(imageData, 0, 0);
      }

      init();
      draw(0);
      window.addEventListener("hf-seek", function (e) { draw(e.detail.time); });

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 10); // the film's motion is drawn by the hf-seek hook; the timeline spans the 10 s
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

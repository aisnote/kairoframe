  Port notes: the pen's CSS keyframes (clip 3000ms + glitchN 500ms, all linear, with their negative delays) are
  evaluated here as pure functions of film time, driven by the paused GSAP timeline. Sizes are scaled by S = 2.2
  for 1080p. The pen uses no randomness, so no random generator is needed.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Only CSS: Glitch Effect</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; background: #0E0D0E; }
      #root {
        position: relative;
        overflow: hidden;
        width: 1920px;
        height: 1080px;
        /* original: 10px stripes period, scaled ×2.2 */
        background: repeating-linear-gradient(0deg, #0E0D0E 25%, #0E0D0E 50%, #171819 50%, #171819 75%);
        background-size: 22px 22px;
        font-family: "Barlow", sans-serif;
      }
      #stage {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .glitch {
        position: relative;
        color: #fff;
        font-size: 176px; /* 80px × 2.2 */
        font-weight: 100;
        white-space: nowrap;
      }
      .line:not(:first-child) { position: absolute; top: 0; left: 0; }
      .line { will-change: transform, clip-path; }
      #credit {
        position: absolute;
        right: 96px;
        bottom: 54px;
        margin: 0;
        font-family: "Barlow", sans-serif;
        font-weight: 400;
        font-size: 24px;
        letter-spacing: 0.02em;
        color: #8a8d91;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <div id="stage">
        <div class="glitch">
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
          <div class="line">GLITCH EFFECT</div>
        </div>
      </div>
      <p id="credit">Only CSS: Glitch Effect — Yusuke Nakaya (CodePen, MIT)</p>
    </div>
    <script>
      const S = 2.2; // 1080p scale
      // Per line, from the pen: clip delay (ms), glitch delay (ms), translateX at 85% / 90% / 95% (px).
      const LINES = [
        [300, 610, [4, 4, 3]],
        [600, 68, [-2, -3, 4]],
        [900, 985, [1, 2, -2]],
        [1200, 966, [-3, -4, -2]],
        [1500, 642, [5, 2, -3]],
        [1800, 233, [3, -4, 0]],
        [2100, 398, [1, -4, 0]],
        [2400, 24, [-1, 5, 1]],
        [2700, 62, [0, 4, 3]],
      ];
      const WHITE = [255, 255, 255], GREEN = [0x4E, 0x9A, 0x26], RED = [0xAC, 0x12, 0x12];
      const frac = (x) => x - Math.floor(x);
      const lerp = (a, b, k) => a + (b - a) * k;
      const lerpC = (a, b, k) => a.map((v, i) => Math.round(lerp(v, b[i], k)));

      // glitchN keyframes, linear: 0%:0 · 80%:0 white · 85%:x1 green · 90%:x2 red · 95%:x3 white · 100%:0
      function glitchAt(p, xs) {
        const stops = [
          [0, 0, WHITE], [0.8, 0, WHITE], [0.85, xs[0], GREEN],
          [0.9, xs[1], RED], [0.95, xs[2], WHITE], [1, 0, WHITE],
        ];
        for (let i = 0; i < stops.length - 1; i++) {
          const [p0, x0, c0] = stops[i], [p1, x1, c1] = stops[i + 1];
          if (p <= p1) {
            const k = (p - p0) / (p1 - p0);
            return { x: lerp(x0, x1, k), c: lerpC(c0, c1, k) };
          }
        }
        return { x: 0, c: WHITE };
      }

      const els = Array.from(document.querySelectorAll(".line"));
      function render(t) {
        els.forEach((el, i) => {
          const [clipDelay, glitchDelay, xs] = LINES[i];
          // clip: 3000ms linear; band 100%..120% → -20%..0%
          const pc = frac((t * 1000 + clipDelay) / 3000);
          const top = lerp(100, -20, pc), bottom = lerp(120, 0, pc);
          el.style.clipPath = `polygon(0% ${top}%, 100% ${top}%, 100% ${bottom}%, 0% ${bottom}%)`;
          // glitchN: 500ms linear
          const g = glitchAt(frac((t * 1000 + glitchDelay) / 500), xs);
          el.style.transform = `translateX(${(g.x * S).toFixed(2)}px)`;
          el.style.color = `rgb(${g.c[0]}, ${g.c[1]}, ${g.c[2]})`;
        });
      }
      render(0);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const clock = { t: 0 };
      tl.to(clock, { t: 10, duration: 10, ease: "none", onUpdate: () => render(clock.t) }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>

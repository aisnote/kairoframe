<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ORBITAL</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
    </script>
    <style>
      html, body { margin: 0; background: #02030a; font-family: "Inter", sans-serif; }
      #root { position: relative; overflow: hidden; background: #02030a; color: #fff; }
      .clip { position: absolute; }
      #scene { left: 0; top: 0; width: 1920px; height: 1080px; z-index: 0; }
      #scene canvas { display: block; width: 1920px; height: 1080px; }
      #vignette {
        left: 0; top: 0; width: 1920px; height: 1080px; z-index: 1; pointer-events: none;
        background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
      }
      #title, #sub { left: 0; width: 1920px; text-align: center; margin: 0; z-index: 2; }
      #title {
        top: 400px; font-size: 150px; font-weight: 200; letter-spacing: 0.6em;
        padding-left: 0.6em; /* balances the trailing letter-space so the word is centred */
        text-shadow: 0 0 40px rgba(120, 190, 255, 0.45);
      }
      #sub {
        top: 600px; font-size: 40px; font-weight: 300; letter-spacing: 0.32em; padding-left: 0.32em;
        color: #c8d8ee; text-transform: uppercase;
        text-shadow: 0 0 14px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="12">
      <div id="scene" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
      <div id="vignette" class="clip" data-start="0" data-duration="12" data-track-index="1"></div>
      <h1 id="title" class="clip" data-start="3" data-duration="7" data-track-index="2">ORBITAL</h1>
      <p id="sub" class="clip" data-start="4" data-duration="6" data-track-index="3">A WebGL scene rendered frame by frame</p>
    </div>

    <script>
      // Titles: GSAP timeline on film time.
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, letterSpacing: "0.9em", paddingLeft: "0.9em" },
                          { opacity: 1, letterSpacing: "0.6em", paddingLeft: "0.6em", duration: 1.6, ease: "power2.out" }, 3);
      tl.fromTo("#sub", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.2, ease: "power2.out" }, 4);
      tl.to("#title", { opacity: 0, duration: 1.0, ease: "power1.in" }, 8.9);
      tl.to("#sub", { opacity: 0, duration: 0.9, ease: "power1.in" }, 9.0);
      window.__timelines["main"] = tl;

      // The 3D module loads asynchronously; seeks that arrive first wait for it.
      window.__orbital = { draw: null };
      window.__orbitalReady = new Promise((res) => { window.__orbital.resolve = res; });
      // If the 3D module fails, report it and release waiting seeks instead of hanging the render.
      window.addEventListener("error", (ev) => {
        console.error("orbital scene failed: " + ev.message + " @" + ev.lineno);
        window.__orbital.draw = window.__orbital.draw || (() => {});
        window.__orbital.resolve();
      });
      window.addEventListener("hf-seek", (e) => {
        const t = e.detail.time;
        if (window.__orbital.draw) window.__orbital.draw(t);
        else e.detail.waitUntil(window.__orbitalReady.then(() => window.__orbital.draw(t)));
      });
    </script>

    <script type="module">
      import * as THREE from "three";

      // ---------- seeded randomness ----------
      function mulberry32(a) {
        return function () {
          a |= 0; a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // Hash-based 3D value noise (deterministic).
      function hash3(x, y, z) {
        let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      const fade = (t) => t * t * (3 - 2 * t);
      function vnoise(x, y, z) {
        const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
        const xf = fade(x - xi), yf = fade(y - yi), zf = fade(z - zi);
        const L = (a, b, t) => a + (b - a) * t;
        const c = (i, j, k) => hash3(xi + i, yi + j, zi + k);
        return L(
          L(L(c(0,0,0), c(1,0,0), xf), L(c(0,1,0), c(1,1,0), xf), yf),
          L(L(c(0,0,1), c(1,0,1), xf), L(c(0,1,1), c(1,1,1), xf), yf), zf);
      }
      function fbm(x, y, z) {
        let s = 0, a = 0.5, f = 1;
        for (let i = 0; i < 5; i++) { s += a * vnoise(x * f + 17.3, y * f - 4.1, z * f + 9.7); f *= 2.03; a *= 0.5; }
        return s; // ~0..1
      }

      // ---------- renderer ----------
      const W = 1920, H = 1080;
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.getElementById("scene").appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x02030a);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.01, 2000);

      // ---------- light ----------
      const sunDir = new THREE.Vector3(0.85, 0.3, 0.45).normalize();
      const sun = new THREE.DirectionalLight(0xfff1dc, 3.2);
      sun.position.copy(sunDir).multiplyScalar(50);
      scene.add(sun);
      scene.add(new THREE.HemisphereLight(0x3a5a9a, 0x0a0614, 0.55));

      // ---------- planet ----------
      const system = new THREE.Group();
      system.rotation.z = 0.18; // axial tilt of the whole system
      scene.add(system);

      const planet = new THREE.Group();
      system.add(planet);

      const geo = new THREE.IcosahedronGeometry(1, 12);
      const pos = geo.attributes.position;
      const colors = new Float32Array(pos.count * 3);
      const v = new THREE.Vector3();
      const heights = new Float32Array(pos.count);
      const SEA = 0.5;
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).normalize();
        const n = fbm(v.x * 1.8, v.y * 1.8, v.z * 1.8);
        heights[i] = n;
        const r = n > SEA ? 1 + (n - SEA) * 0.16 : 1;
        pos.setXYZ(i, v.x * r, v.y * r, v.z * r);
      }
      const palette = {
        deep: new THREE.Color(0x0e3a6e), shallow: new THREE.Color(0x1f74a8), sand: new THREE.Color(0xd8c48a),
        grass: new THREE.Color(0x4f9a4a), forest: new THREE.Color(0x2f6b3a), rock: new THREE.Color(0x7d6a5a),
        snow: new THREE.Color(0xf2f5f8),
      };
      const col = new THREE.Color();
      for (let f = 0; f < pos.count; f += 3) {
        const h = (heights[f] + heights[f + 1] + heights[f + 2]) / 3;
        v.fromBufferAttribute(pos, f).normalize();
        const lat = Math.abs(v.y);
        if (lat > 0.88 - (h - 0.5) * 0.4) col.copy(palette.snow);
        else if (h < SEA - 0.06) col.copy(palette.deep);
        else if (h < SEA) col.copy(palette.shallow);
        else if (h < SEA + 0.02) col.copy(palette.sand);
        else if (h < SEA + 0.08) col.copy(palette.grass);
        else if (h < SEA + 0.14) col.copy(palette.forest);
        else if (h < SEA + 0.2) col.copy(palette.rock);
        else col.copy(palette.snow);
        // subtle deterministic jitter per face for a faceted look
        const j = (hash3(f, 7, 13) - 0.5) * 0.06;
        col.offsetHSL(0, 0, j);
        for (let k = 0; k < 3; k++) colors.set([col.r, col.g, col.b], (f + k) * 3);
      }
      geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      geo.computeVertexNormals(); // non-indexed → per-face normals (flat)
      const planetMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        vertexColors: true, flatShading: true, roughness: 0.85, metalness: 0.0,
      }));
      planet.add(planetMesh);

      // ---------- atmosphere rim ----------
      const atmoMat = new THREE.ShaderMaterial({
        uniforms: { sunDir: { value: sunDir }, color: { value: new THREE.Color(0x5ab4ff) } },
        vertexShader: `
          varying vec3 vN; varying vec3 vView; varying vec3 vWN;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWN = normalize(mat3(modelMatrix) * normal);
            vView = normalize(cameraPosition - wp.xyz);
            gl_Position = projectionMatrix * viewMatrix * wp;
          }`,
        fragmentShader: `
          uniform vec3 sunDir; uniform vec3 color;
          varying vec3 vView; varying vec3 vWN;
          void main() {
            float ndv = dot(vWN, vView);
            float rim = pow(clamp(1.0 - ndv, 0.0, 1.0), 4.0);
            float lit = clamp(dot(vWN, sunDir) * 0.8 + 0.45, 0.08, 1.0);
            float a = rim * lit * 1.6;
            gl_FragColor = vec4(color * a, a);
          }`,
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.FrontSide,
      });
      system.add(new THREE.Mesh(new THREE.SphereGeometry(1.035, 96, 64), atmoMat));
      // outer halo (back side) so the glow extends past the limb
      const haloMat = atmoMat.clone();
      haloMat.side = THREE.BackSide;
      haloMat.fragmentShader = `
        uniform vec3 sunDir; uniform vec3 color;
        varying vec3 vView; varying vec3 vWN;
        void main() {
          float ndv = dot(-vWN, vView);
          float g = pow(clamp(ndv, 0.0, 1.0), 6.0);
          float lit = clamp(dot(-vWN, sunDir) * -0.6 + 0.5, 0.1, 1.0);
          float lit2 = clamp(dot(vWN, sunDir) * 0.7 + 0.45, 0.08, 1.0);
          float a = g * lit2 * 0.9;
          gl_FragColor = vec4(color * a, a);
        }`;
      system.add(new THREE.Mesh(new THREE.SphereGeometry(1.12, 96, 64), haloMat));

      // ---------- particle ring ----------
      const rng = mulberry32(20261124);
      const RING_N = 9000;
      const ringPos = new Float32Array(RING_N * 3);
      const ringCol = new Float32Array(RING_N * 3);
      for (let i = 0; i < RING_N; i++) {
        const band = rng();
        const rad = 1.65 + Math.pow(band, 0.8) * 0.75 + (band > 0.55 && band < 0.6 ? 0.08 : 0); // gap-ish
        const a = rng() * Math.PI * 2;
        ringPos[i * 3] = Math.cos(a) * rad;
        ringPos[i * 3 + 1] = (rng() - 0.5) * 0.015;
        ringPos[i * 3 + 2] = Math.sin(a) * rad;
        const b = 0.55 + rng() * 0.45;
        ringCol[i * 3] = 0.85 * b; ringCol[i * 3 + 1] = 0.8 * b; ringCol[i * 3 + 2] = 0.72 * b;
      }
      const ringGeo = new THREE.BufferGeometry();
      ringGeo.setAttribute("position", new THREE.BufferAttribute(ringPos, 3));
      ringGeo.setAttribute("color", new THREE.BufferAttribute(ringCol, 3));
      const ring = new THREE.Points(ringGeo, new THREE.PointsMaterial({
        size: 0.012, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.9, depthWrite: false,
      }));
      const ringPivot = new THREE.Group();
      ringPivot.rotation.x = 0.32;
      ringPivot.add(ring);
      system.add(ringPivot);

      // ---------- moons ----------
      function makeMoon(radius, color, seed) {
        const g = new THREE.IcosahedronGeometry(radius, 2);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          v.fromBufferAttribute(p, i);
          const n = vnoise(v.x * 30 + seed, v.y * 30, v.z * 30);
          v.multiplyScalar(1 + (n - 0.5) * 0.12);
          p.setXYZ(i, v.x, v.y, v.z);
        }
        g.computeVertexNormals();
        return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 1 }));
      }
      const moons = [
        { mesh: makeMoon(0.15, 0xb9b2a8, 3), dist: 2.75, speed: 0.22, phase: 2.6, tiltX: 0.45, tiltZ: -0.2 },
        { mesh: makeMoon(0.1, 0xc98a5a, 11), dist: 3.5, speed: -0.15, phase: 3.6, tiltX: -0.3, tiltZ: 0.5 },
      ];
      for (const m of moons) {
        m.pivot = new THREE.Group();
        m.pivot.rotation.set(m.tiltX, 0, m.tiltZ);
        m.pivot.add(m.mesh);
        scene.add(m.pivot);
      }

      // ---------- starfield ----------
      function starLayer(count, size, seed) {
        const r = mulberry32(seed);
        const p = new Float32Array(count * 3), c = new Float32Array(count * 3);
        const tint = new THREE.Color();
        for (let i = 0; i < count; i++) {
          const u = r() * 2 - 1, th = r() * Math.PI * 2, s = Math.sqrt(1 - u * u);
          const R = 600 + r() * 300;
          p[i * 3] = s * Math.cos(th) * R; p[i * 3 + 1] = u * R; p[i * 3 + 2] = s * Math.sin(th) * R;
          tint.setHSL(0.55 + (r() - 0.5) * 0.5, 0.3 * r(), 0.55 + r() * 0.45);
          const b = Math.pow(r(), 2.2) * 0.85 + 0.15;
          c[i * 3] = tint.r * b; c[i * 3 + 1] = tint.g * b; c[i * 3 + 2] = tint.b * b;
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute("position", new THREE.BufferAttribute(p, 3));
        g.setAttribute("color", new THREE.BufferAttribute(c, 3));
        return new THREE.Points(g, new THREE.PointsMaterial({ size, vertexColors: true, sizeAttenuation: false, depthWrite: false }));
      }
      scene.add(starLayer(7000, 1.4, 101));
      scene.add(starLayer(900, 2.4, 202));
      scene.add(starLayer(120, 3.4, 303));

      // ---------- camera move ----------
      const clamp01 = (x) => Math.min(1, Math.max(0, x));
      const easeInOut = (x) => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
      const smoother = (x) => x * x * x * (x * (x * 6 - 15) + 10);
      const lerp = (a, b, t) => a + (b - a) * t;
      const target = new THREE.Vector3();

      function draw(t) {
        // planet + ring + moons from film time only
        planet.rotation.y = 0.6 + t * 0.09;
        ring.rotation.y = t * 0.05;
        for (const m of moons) {
          const a = m.phase + t * m.speed;
          m.mesh.position.set(Math.cos(a) * m.dist, 0, Math.sin(a) * m.dist);
          m.mesh.rotation.y = a * 2;
        }

        // one continuous pull-back-and-around move
        const p = smoother(clamp01(t / 11.5));
        const dist = lerp(1.5, 6.6, Math.pow(p, 1.25));
        const az = lerp(-0.35, 1.55, easeInOut(clamp01(t / 12)));
        const el = lerp(-0.02, 0.36, p);
        camera.position.set(
          Math.cos(el) * Math.sin(az) * dist,
          Math.sin(el) * dist,
          Math.cos(el) * Math.cos(az) * dist);
        // start: look past the limb (horizon low in frame); end: frame the whole system
        const k = smoother(clamp01(t / 9));
        const up = new THREE.Vector3(0, 1, 0);
        target.copy(up).multiplyScalar(lerp(1.42, 0, k));
        camera.lookAt(target);
        camera.fov = lerp(34, 42, p);
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      window.__orbital.draw = draw;
      draw(0);
      window.__orbital.resolve();
    </script>
  </body>
</html>

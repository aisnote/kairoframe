<!--
  Based on 'Learning Shaders 003' by Sean Free, https://codepen.io/seanfree/pen/OOdQXZ, MIT License
  Classic Perlin noise "cnoise" by Stefan Gustavson (https://github.com/stegu/webgl-noise), MIT License.
  Ported to a kairoframe film: every frame depends only on the film time (hf-seek), the random start is seeded.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Learning Shaders 003</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/86/three.min.js"></script>
    <style>
      html, body { margin: 0; padding: 0; background: #000; }
      #root { position: relative; overflow: hidden; background: #000; }
      #canvas { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; z-index: 0; }
      #credit {
        position: absolute; right: 96px; bottom: 54px; margin: 0; z-index: 1;
        font-family: "Inter", "Helvetica Neue", Arial, sans-serif; font-size: 26px; font-weight: 400;
        letter-spacing: 0.02em; color: rgba(255, 255, 255, 0.72);
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <canvas id="canvas" width="1920" height="1080"></canvas>
      <p id="credit" class="clip" data-start="0" data-duration="10">Learning Shaders 003 — Sean Free (CodePen, MIT)</p>
    </div>

    <script>
      // Shader sources copied verbatim from the original pen (kept as JS strings so the page loads them as data).
      window.VERT_SHADER = `
	uniform float time;
	uniform float yPos;
	uniform vec2 resolution;
	void main()
	{
		gl_Position = vec4(position, 1.0);
	}
`;
      window.FRAG_SHADER = `

	//
	// GLSL textureless classic 3D noise "cnoise",
	// with an RSL-style periodic variant "pnoise".
	// Author:  Stefan Gustavson (stefan.gustavson@liu.se)
	// Version: 2011-10-11
	//
	// Many thanks to Ian McEwan of Ashima Arts for the
	// ideas for permutation and gradient selection.
	//
	// Copyright (c) 2011 Stefan Gustavson. All rights reserved.
	// Distributed under the MIT license. See LICENSE file.
	// https://github.com/stegu/webgl-noise
	//

	vec3 mod289(vec3 x)
	{
		return x - floor(x * (1.0 / 289.0)) * 289.0;
	}

	vec4 mod289(vec4 x)
	{
		return x - floor(x * (1.0 / 289.0)) * 289.0;
	}

	vec4 permute(vec4 x)
	{
		return mod289(((x*34.0)+1.0)*x);
	}

	vec4 taylorInvSqrt(vec4 r)
	{
		return 1.79284291400159 - 0.85373472095314 * r;
	}

	vec3 fade(vec3 t) {
		return t*t*t*(t*(t*6.0-15.0)+10.0);
	}

	// Classic Perlin noise
	float cnoise(vec3 P)
	{
		vec3 Pi0 = floor(P); // Integer part for indexing
		vec3 Pi1 = Pi0 + vec3(1.0); // Integer part + 1
		Pi0 = mod289(Pi0);
		Pi1 = mod289(Pi1);
		vec3 Pf0 = fract(P); // Fractional part for interpolation
		vec3 Pf1 = Pf0 - vec3(1.0); // Fractional part - 1.0
		vec4 ix = vec4(Pi0.x, Pi1.x, Pi0.x, Pi1.x);
		vec4 iy = vec4(Pi0.yy, Pi1.yy);
		vec4 iz0 = Pi0.zzzz;
		vec4 iz1 = Pi1.zzzz;

		vec4 ixy = permute(permute(ix) + iy);
		vec4 ixy0 = permute(ixy + iz0);
		vec4 ixy1 = permute(ixy + iz1);

		vec4 gx0 = ixy0 * (1.0 / 7.0);
		vec4 gy0 = fract(floor(gx0) * (1.0 / 7.0)) - 0.5;
		gx0 = fract(gx0);
		vec4 gz0 = vec4(0.5) - abs(gx0) - abs(gy0);
		vec4 sz0 = step(gz0, vec4(0.0));
		gx0 -= sz0 * (step(0.0, gx0) - 0.5);
		gy0 -= sz0 * (step(0.0, gy0) - 0.5);

		vec4 gx1 = ixy1 * (1.0 / 7.0);
		vec4 gy1 = fract(floor(gx1) * (1.0 / 7.0)) - 0.5;
		gx1 = fract(gx1);
		vec4 gz1 = vec4(0.5) - abs(gx1) - abs(gy1);
		vec4 sz1 = step(gz1, vec4(0.0));
		gx1 -= sz1 * (step(0.0, gx1) - 0.5);
		gy1 -= sz1 * (step(0.0, gy1) - 0.5);

		vec3 g000 = vec3(gx0.x,gy0.x,gz0.x);
		vec3 g100 = vec3(gx0.y,gy0.y,gz0.y);
		vec3 g010 = vec3(gx0.z,gy0.z,gz0.z);
		vec3 g110 = vec3(gx0.w,gy0.w,gz0.w);
		vec3 g001 = vec3(gx1.x,gy1.x,gz1.x);
		vec3 g101 = vec3(gx1.y,gy1.y,gz1.y);
		vec3 g011 = vec3(gx1.z,gy1.z,gz1.z);
		vec3 g111 = vec3(gx1.w,gy1.w,gz1.w);

		vec4 norm0 = taylorInvSqrt(vec4(dot(g000, g000), dot(g010, g010), dot(g100, g100), dot(g110, g110)));
		g000 *= norm0.x;
		g010 *= norm0.y;
		g100 *= norm0.z;
		g110 *= norm0.w;
		vec4 norm1 = taylorInvSqrt(vec4(dot(g001, g001), dot(g011, g011), dot(g101, g101), dot(g111, g111)));
		g001 *= norm1.x;
		g011 *= norm1.y;
		g101 *= norm1.z;
		g111 *= norm1.w;

		float n000 = dot(g000, Pf0);
		float n100 = dot(g100, vec3(Pf1.x, Pf0.yz));
		float n010 = dot(g010, vec3(Pf0.x, Pf1.y, Pf0.z));
		float n110 = dot(g110, vec3(Pf1.xy, Pf0.z));
		float n001 = dot(g001, vec3(Pf0.xy, Pf1.z));
		float n101 = dot(g101, vec3(Pf1.x, Pf0.y, Pf1.z));
		float n011 = dot(g011, vec3(Pf0.x, Pf1.yz));
		float n111 = dot(g111, Pf1);

		vec3 fade_xyz = fade(Pf0);
		vec4 n_z = mix(vec4(n000, n100, n010, n110), vec4(n001, n101, n011, n111), fade_xyz.z);
		vec2 n_yz = mix(n_z.xy, n_z.zw, fade_xyz.y);
		float n_xyz = mix(n_yz.x, n_yz.y, fade_xyz.x);
		return 2.2 * n_xyz;
	}

	uniform float time;
	uniform float yPos;
	uniform vec2 resolution;

	void main()
	{
		vec2 pos;
		float n = 0.0;
		float r, g, b;

		pos = (gl_FragCoord.xy / resolution.y) + vec2(0.0, yPos);

		for (float i = 1.0; i <= 7.0; i++) {
			n += cnoise(i * (n + vec3(pos, n + time))) / i;
		}

		b = 0.95 * (1.0 - abs(sin(1.0 - n * 2.0)));
		g = 0.65 * b;
		r = 0.15 * (abs(1.0 - n * 2.0));

		gl_FragColor = vec4(vec3(r, g, b).rgb, 1.0);
	}
`;
    </script>

    <script>
      // Seeded generator (mulberry32) replacing the original's unseeded random start tick.
      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const random = mulberry32(3);

      const W = 1920, H = 1080;
      // The original advances `tick` by 1 per animation frame (~60 fps) from a random start.
      const START_TICK = Math.round(random() * 5000);
      const TICKS_PER_SECOND = 60;
      const SPEED = 2; // the film runs the flow at 2x the original's pace so it moves clearly in 10 s

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 10000);
      camera.position.z = 1;

      const uniforms = {
        time: { type: "f", value: 0.0 },
        yPos: { type: "f", value: 0.0 },
        resolution: { type: "v2", value: new THREE.Vector2(W, H) },
      };
      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader: window.VERT_SHADER,
        fragmentShader: window.FRAG_SHADER,
      });
      scene.add(new THREE.Mesh(new THREE.PlaneBufferGeometry(2, 2), material));

      const renderer = new THREE.WebGLRenderer({
        canvas: document.getElementById("canvas"),
        preserveDrawingBuffer: true,
      });
      renderer.setPixelRatio(1);
      renderer.setSize(W, H, false);

      function draw(t) {
        const tick = START_TICK + t * TICKS_PER_SECOND * SPEED;
        uniforms.time.value = 0.00035 * tick;
        uniforms.yPos.value = -0.0005 * tick;
        renderer.render(scene, camera);
      }
      window.addEventListener("hf-seek", (e) => draw(e.detail.time));
      draw(0);

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#credit", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power1.out" }, 0.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
